<div class="wrap">
  <header class="top">
    <div class="row"><h1>Processing</h1><span class="sub">Livestock Veterinary Resources</span></div>
    <div class="pt" id="ptline">New processing visit</div>
  </header>

  <section>
    <h2>Visit</h2>
    <div class="grid g2">
      <div><label class="lab" for="owner">Owner / Account</label><input type="text" id="owner" autocomplete="off"></div>
      <div><label class="lab" for="date">Date</label><input type="text" id="date" autocomplete="off" placeholder="mm/dd/yy"></div>
      <div><label class="lab" for="location">Location / Herd</label><input type="text" id="location" autocomplete="off"></div>
      <div><label class="lab" for="vet">Veterinarian</label><input type="text" id="vet" autocomplete="off"></div>
    </div>
  </section>

  <section class="head">
    <h2>Head Count</h2>
    <div class="grid g4" id="headGrid"></div>
  </section>

  <section>
    <h2>Items</h2>
    <input type="text" id="search" placeholder="Search items…" autocomplete="off" inputmode="search">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <section>
    <h2>Other Comments</h2>
    <textarea id="comments" rows="3" placeholder="Anything else…"></textarea>
  </section>

  <section>
    <h2>Summary</h2>
    <div id="summaryText">—</div>
    <div class="hint">Auto-built from head count + items. Copy or email to post charges.</div>
  </section>
</div>

<div class="actions">
  <span class="grand" id="grand">$0.00</span>
  <button class="btn" type="button" id="clearBtn">New</button>
  <button class="btn" type="button" id="copyBtn">Copy</button>
  <button class="btn primary" type="button" id="emailBtn">Email</button>
</div>

<script>
(function(){
  "use strict";
  var CFG=window.PROC_CONFIG||{};
  var KEY="lvr_processing_draft_v2";
  var HEAD=CFG.headClasses||[], SECTIONS=CFG.sectionOrder||[], ITEMS=CFG.items||[];
  function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");}
  function val(id){var e=document.getElementById(id);return e?e.value.trim():"";}
  function money(n){return "$"+n.toFixed(2);}
  var state={head:{},items:{}};   // items[idx]={on,qty,opt}

  // head count
  var hg=document.getElementById("headGrid");
  HEAD.forEach(function(h){var id="head-"+slug(h); state.head[id]={label:h,n:""};
    var cell=document.createElement("div");
    cell.innerHTML='<label class="lab" for="'+id+'">'+h+'</label><input type="number" id="'+id+'" inputmode="numeric" min="0" placeholder="0">';
    hg.appendChild(cell);
    cell.querySelector("input").addEventListener("input",function(e){state.head[id].n=e.target.value;save();render();});
  });

  // item list
  var list=document.getElementById("list"), chips=document.getElementById("chips");
  SECTIONS.forEach(function(sec){
    var its=ITEMS.map(function(it,idx){return {it:it,idx:idx};}).filter(function(o){return o.it.s===sec;});
    if(!its.length)return;
    var g=document.createElement("div"); g.className="grp"; g.id="grp-"+slug(sec);
    g.innerHTML='<h3>'+sec+" ("+its.length+")</h3>";
    var box=document.createElement("div"); box.className="items";
    its.forEach(function(o){
      var it=o.it, idx=o.idx, opts=it.opts||[], multi=opts.length>1;
      state.items[idx]={on:false,qty:"",opt:0};
      var row=document.createElement("div"); row.className="item"; row.dataset.idx=idx;
      row.dataset.hay=(it.n+" "+it.s).toLowerCase();
      // line 1
      var l1=document.createElement("label"); l1.className="l1";
      l1.innerHTML='<input type="checkbox"><span class="nm">'+it.n+'</span><span class="up"></span>';
      // controls
      var ctl=document.createElement("div"); ctl.className="ctl";
      var sizesHtml="";
      if(multi){ sizesHtml='<div class="sizes">'+opts.map(function(op,i){
          return '<button type="button" class="sz'+(i===0?" on":"")+'" data-i="'+i+'">'+op.u+'</button>';}).join("")+'</div>';
      } else { sizesHtml='<span class="unit1">'+(opts[0]?opts[0].u:"each")+'</span>'; }
      ctl.innerHTML=sizesHtml+'<span class="qtywrap"><input type="number" class="qty" inputmode="decimal" min="0" placeholder="0"><span class="tot"></span></span>';
      row.appendChild(l1); row.appendChild(ctl); box.appendChild(row);

      var cb=l1.querySelector('input[type=checkbox]'), qty=ctl.querySelector('.qty');
      var s=state.items[idx]; s._row=row; s._cb=cb; s._qty=qty; s._up=l1.querySelector('.up'); s._tot=ctl.querySelector('.tot'); s._opts=opts;
      updateUnit(idx);
      cb.addEventListener("change",function(){ if(cb.checked&&!(+qty.value>0))qty.value=1; if(!cb.checked)qty.value=""; syncItem(idx);});
      qty.addEventListener("input",function(){cb.checked=(+qty.value>0); syncItem(idx);});
      qty.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();});
      if(multi){ ctl.querySelectorAll(".sz").forEach(function(b){
        b.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();
          ctl.querySelectorAll(".sz").forEach(function(x){x.classList.remove("on");});
          b.classList.add("on"); state.items[idx].opt=+b.dataset.i; updateUnit(idx); syncItem(idx);});
      });}
    });
    g.appendChild(box); list.appendChild(g);
    var a=document.createElement("a"); a.className="chip"; a.href="#grp-"+slug(sec); a.textContent=sec; chips.appendChild(a);
  });
  function curOpt(idx){var s=state.items[idx]; return (s._opts&&s._opts[s.opt])||{u:"",p:null};}
  function updateUnit(idx){var s=state.items[idx], op=curOpt(idx);
    s._up.textContent = (op.p!=null)? money(op.p)+" / "+op.u : "";}
  function syncItem(idx){var s=state.items[idx]; s.on=s._cb.checked&&(+s._qty.value>0); s.qty=s._qty.value;
    s._row.classList.toggle("on",s.on);
    var op=curOpt(idx), q=+s._qty.value||0;
    s._tot.textContent = (s.on&&op.p!=null)? money(q*op.p) : "";
    save(); render();}

  // search
  document.getElementById("search").addEventListener("input",function(e){
    var q=e.target.value.trim().toLowerCase();
    document.querySelectorAll(".grp").forEach(function(g){var vis=0;
      g.querySelectorAll(".item").forEach(function(row){var show=!q||row.dataset.hay.indexOf(q)>=0;
        row.classList.toggle("hidden",!show); if(show)vis++;});
      g.classList.toggle("hidden",vis===0);});
  });

  ["owner","date","location","vet","comments"].forEach(function(id){var e=document.getElementById(id); if(e)e.addEventListener("input",function(){save();render();});});

  // summary + grand total
  function chosen(){var out=[]; Object.keys(state.items).forEach(function(idx){var s=state.items[idx];
    if(s.on&&+s.qty>0){var it=ITEMS[idx], op=curOpt(idx);
      out.push({name:it.n,qty:+s.qty,unit:op.u,price:op.p,ord:SECTIONS.indexOf(it.s)});}});
    out.sort(function(a,b){return (a.ord-b.ord)||a.name.localeCompare(b.name);}); return out;}
  function buildSummary(){
    var L=[], head=[];
    if(val("owner"))head.push(val("owner")); if(val("location"))head.push(val("location"));
    var top=[head.join(" — "), val("date")].filter(Boolean).join("  "); if(top)L.push("Processing: "+top);
    if(val("vet"))L.push("Vet: "+val("vet"));
    var hc=[]; HEAD.forEach(function(h){var n=state.head["head-"+slug(h)].n; if(n&&+n>0)hc.push(n+" "+h.toLowerCase());});
    if(hc.length)L.push("Head: "+hc.join(", "));
    var c=chosen(), tot=0;
    if(c.length){ L.push("Items:");
      c.forEach(function(x){ var line="  "+x.qty+" "+x.unit+"  "+x.name;
        if(x.price!=null){var lt=x.qty*x.price; tot+=lt; line+="  = "+money(lt);}
        L.push(line);});
      L.push("Estimated total: "+money(tot));
    }
    if(val("comments"))L.push("Comments: "+val("comments"));
    return {text:L.join("\n"), total:tot};
  }
  function render(){
    var s=buildSummary();
    document.getElementById("summaryText").textContent=s.text||"—";
    document.getElementById("grand").textContent=money(s.total);
    var n=0; Object.keys(state.items).forEach(function(i){if(state.items[i].on)n++;});
    var hc=0; HEAD.forEach(function(h){var v=state.head["head-"+slug(h)].n; if(v&&+v>0)hc+=+v;});
    var pt=[]; if(val("owner"))pt.push(val("owner")); if(hc)pt.push(hc+" hd"); if(n)pt.push(n+" items");
    document.getElementById("ptline").textContent=pt.length?pt.join(" · "):"New processing visit";
  }

  // persistence
  function collect(){var d={inputs:{},head:{},items:{}};
    ["owner","date","location","vet","comments"].forEach(function(id){var e=document.getElementById(id); if(e)d.inputs[id]=e.value;});
    Object.keys(state.head).forEach(function(id){d.head[id]=state.head[id].n;});
    Object.keys(state.items).forEach(function(i){var s=state.items[i]; if(s.on)d.items[i]={qty:s.qty,opt:s.opt};});
    return d;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(collect()));}catch(e){}}
  function load(){var raw;try{raw=localStorage.getItem(KEY);}catch(e){return;} if(!raw)return;
    var d;try{d=JSON.parse(raw);}catch(e){return;}
    if(d.inputs)Object.keys(d.inputs).forEach(function(id){var e=document.getElementById(id); if(e)e.value=d.inputs[id];});
    if(d.head)Object.keys(d.head).forEach(function(id){if(state.head[id]){state.head[id].n=d.head[id]; var e=document.getElementById(id); if(e)e.value=d.head[id];}});
    if(d.items)Object.keys(d.items).forEach(function(i){var s=state.items[i]; if(!s)return; var saved=d.items[i];
      s.opt=saved.opt||0; var szs=s._row.querySelectorAll(".sz");
      if(szs.length)szs.forEach(function(b){b.classList.toggle("on",+b.dataset.i===s.opt);});
      updateUnit(i); s._qty.value=saved.qty; s._cb.checked=(+saved.qty>0); syncItem(i);});
  }

  document.getElementById("copyBtn").addEventListener("click",function(){var t=buildSummary().text,btn=this;
    function ok(){var o=btn.textContent;btn.textContent="Copied ✓";setTimeout(function(){btn.textContent=o;},1400);}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){fb(t);ok();}); else{fb(t);ok();}});
  function fb(t){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);}
  document.getElementById("emailBtn").addEventListener("click",function(){
    var body=buildSummary().text.replace(/\n/g,"\r\n"), who=val("owner")||"";
    var subject="Processing"+(who?" — "+who:"")+(val("date")?" "+val("date"):"");
    window.location.href="mailto:info@livestockveterinaryresources.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);});
  document.getElementById("clearBtn").addEventListener("click",function(){if(!confirm("Clear this visit and start new?"))return;
    try{localStorage.removeItem(KEY);}catch(e){}location.reload();});

  load(); render();
})();
</script>
