<script>
(function(){
  "use strict";
  var CFG=window.EXAM_CONFIG||{};
  var KEY="lvr_field_exam_draft_v1";
  var SYSTEMS=CFG.systems||[], SYNDROMES=CFG.syndromes||[], SUBCATS=CFG.subcats||{},
      TREATMENTS=CFG.treatments||[], ROUTES=CFG.routes||[];
  var state={groups:{},systems:{},syndromes:{},subcats:{},tx:{},txRoute:{}};
  function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");}
  function titleCase(id){return id.replace(/-/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();});}
  function val(id){var e=document.getElementById(id);return e?e.value.trim():"";}

  // ---- option pill groups from config ----
  var GROUP_OPTS={species:CFG.species,ageUnit:CFG.ageUnits,respEffort:CFG.respEffort,mm:CFG.mm};
  Object.keys(GROUP_OPTS).forEach(function(name){
    var g=document.querySelector('.pills[data-group="'+name+'"]'); if(!g||!GROUP_OPTS[name])return;
    GROUP_OPTS[name].forEach(function(opt){
      var b=document.createElement("button"); b.type="button";
      b.className="pill"+(g.hasAttribute("data-default-first")?" sm":""); b.textContent=opt; g.appendChild(b);
    });
  });

  // ---- systems ----
  var sysWrap=document.getElementById("systems");
  SYSTEMS.forEach(function(name){
    var id=slug(name); state.systems[id]={abnl:false,note:""};
    var row=document.createElement("div"); row.className="sysrow";
    row.innerHTML='<span class="nm">'+name+'</span>'+
      '<div class="seg" role="group" aria-label="'+name+'">'+
        '<button type="button" class="on-ok" data-v="normal">Normal</button>'+
        '<button type="button" data-v="abnl">Abnl</button></div>';
    var note=document.createElement("input"); note.type="text"; note.placeholder=name+" findings…";
    note.className="sysnote"; note.hidden=true; note.setAttribute("aria-label",name+" findings");
    var btns=row.querySelectorAll(".seg button");
    btns[0].addEventListener("click",function(){setSys(id,false);});
    btns[1].addEventListener("click",function(){setSys(id,true);});
    note.addEventListener("input",function(){state.systems[id].note=note.value;save();render();});
    sysWrap.appendChild(row); sysWrap.appendChild(note);
    state.systems[id]._btns=btns; state.systems[id]._note=note;
  });
  function setSys(id,abnl){var o=state.systems[id];o.abnl=abnl;
    o._btns[0].className=abnl?"":"on-ok"; o._btns[1].className=abnl?"on-warn":"";
    o._note.hidden=!abnl; save(); render();}

  // ---- syndromes ----
  var synPills=document.getElementById("synPills"), synPanels=document.getElementById("synPanels");
  SYNDROMES.forEach(function(name){
    var id=slug(name); state.syndromes[id]=false; state.subcats[id]=[];
    var b=document.createElement("button"); b.type="button"; b.className="pill"; b.textContent=name;
    b.addEventListener("click",function(){state.syndromes[id]=!state.syndromes[id];
      b.classList.toggle("active",state.syndromes[id]);
      document.getElementById("panel-"+id).hidden=!state.syndromes[id];save();render();});
    synPills.appendChild(b);
    var panel=document.createElement("div"); panel.className="panel"; panel.id="panel-"+id; panel.hidden=true;
    var inner="";
    if(name==="Other")inner+='<div class="field"><label class="lab" for="other-name">Which</label><input type="text" id="other-name" autocomplete="off"></div>';
    if(SUBCATS[name]){inner+='<p class="subttl">'+name+' type</p><div class="pills" data-sub="'+id+'" style="margin-bottom:10px">';
      SUBCATS[name].forEach(function(sc){inner+='<button type="button" class="pill sm">'+sc+'</button>';});inner+='</div>';}
    inner+='<label class="lab" for="note-'+id+'">Notes</label><textarea id="note-'+id+'"></textarea>';
    panel.innerHTML=inner; synPanels.appendChild(panel);
    panel.querySelector("#note-"+id).addEventListener("input",function(){save();render();});
    var on=panel.querySelector("#other-name"); if(on)on.addEventListener("input",function(){save();render();});
    var sw=panel.querySelector('[data-sub="'+id+'"]');
    if(sw)sw.querySelectorAll("button").forEach(function(sb){sb.addEventListener("click",function(){sb.classList.toggle("active");
      state.subcats[id]=Array.prototype.map.call(sw.querySelectorAll("button.active"),function(x){return x.textContent;});save();render();});});
    state.syndromes[id+"_btn"]=b;
  });

  // ---- treatments ----
  var txPills=document.getElementById("txPills"), txPanels=document.getElementById("txPanels");
  TREATMENTS.forEach(function(name){
    var id=slug(name); state.tx[id]=false; state.txRoute[id]=null;
    var b=document.createElement("button"); b.type="button"; b.className="pill"; b.textContent=name;
    b.addEventListener("click",function(){state.tx[id]=!state.tx[id];
      b.classList.toggle("active",state.tx[id]);
      document.getElementById("txpanel-"+id).hidden=!state.tx[id];save();render();});
    txPills.appendChild(b);
    var panel=document.createElement("div"); panel.className="panel"; panel.id="txpanel-"+id; panel.hidden=true;
    var inner="";
    if(name==="Other")inner+='<div class="field"><label class="lab" for="tx-other-name">Drug</label><input type="text" id="tx-other-name" autocomplete="off"></div>';
    inner+='<div class="field"><label class="lab" for="ml-'+id+'">Dose (ml)</label><input type="number" id="ml-'+id+'" inputmode="decimal" min="0" step="0.1"></div>';
    inner+='<p class="subttl">Route</p><div class="pills" data-route="'+id+'">';
    ROUTES.forEach(function(r){inner+='<button type="button" class="pill sm">'+r+'</button>';});inner+='</div>';
    panel.innerHTML=inner; txPanels.appendChild(panel);
    panel.querySelector("#ml-"+id).addEventListener("input",function(){save();render();});
    var on=panel.querySelector("#tx-other-name"); if(on)on.addEventListener("input",function(){save();render();});
    var rw=panel.querySelector('[data-route="'+id+'"]');
    rw.querySelectorAll("button").forEach(function(rb){rb.addEventListener("click",function(){
      var was=rb.classList.contains("active");
      rw.querySelectorAll("button").forEach(function(x){x.classList.remove("active");});
      if(!was){rb.classList.add("active");state.txRoute[id]=rb.textContent.trim();}else state.txRoute[id]=null;
      save();render();});});
    state.tx[id+"_btn"]=b;
  });

  // ---- generic single/multi groups (species, ageUnit, respEffort, mm, sex, repro) ----
  document.querySelectorAll('.pills[data-group]').forEach(function(g){
    var name=g.getAttribute("data-group"), mode=g.getAttribute("data-mode");
    state.groups[name]=mode==="single"?null:[];
    g.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click",function(){
        if(mode==="single"){var was=btn.classList.contains("active");
          g.querySelectorAll("button").forEach(function(x){x.classList.remove("active");});
          if(!was){btn.classList.add("active");state.groups[name]=btn.textContent.trim();}else state.groups[name]=null;
          if(name==="sex")updateRepro();
        }else{btn.classList.toggle("active");
          state.groups[name]=Array.prototype.map.call(g.querySelectorAll("button.active"),function(x){return x.textContent.trim();});}
        save();render();
      });
    });
    if(g.hasAttribute("data-default-first")){var f=g.querySelector("button"); if(f){f.classList.add("active");state.groups[name]=f.textContent.trim();}}
  });
  function updateRepro(){var s=state.groups.sex,nb=document.getElementById("neuterBtn");
    nb.textContent=s==="Male"?"Castrated":s==="Female"?"Spayed":"Neutered";}

  // ---- bloodwork toggle ----
  var adv=document.getElementById("advPanel"), advT=document.getElementById("advToggle");
  advT.addEventListener("click",function(){var open=adv.hidden; adv.hidden=!open;
    advT.setAttribute("aria-expanded",open?"true":"false");advT.querySelector(".chev").classList.toggle("up",open);});

  // ---- text/number autosave ----
  ["owner","animalId","color","age","weight","temp","hr","rr","pcv","tp","glucose","otherComments"].forEach(function(id){
    var el=document.getElementById(id); if(el)el.addEventListener("input",function(){save();render();});});

  // ---- summary ----
  function buildSummary(){
    var L=[];
    var idp=[]; if(val("owner"))idp.push(val("owner")); if(val("animalId"))idp.push("ID "+val("animalId"));
    var sig=[]; if(state.groups.species)sig.push(state.groups.species);
    if(val("age"))sig.push(val("age")+" "+(state.groups.ageUnit||""));
    var sx=[]; if(state.groups.sex)sx.push(state.groups.sex); if(state.groups.repro)sx.push(state.groups.repro);
    if(sx.length)sig.push(sx.join(" ")); if(val("color"))sig.push(val("color"));
    var head=[idp.join(", "),sig.join(", ")].filter(Boolean).join(" — "); if(head)L.push(head);

    var v=[];
    if(val("weight"))v.push("Wt "+val("weight")); if(val("temp"))v.push("T "+val("temp"));
    if(val("hr"))v.push("HR "+val("hr")); if(val("rr"))v.push("RR "+val("rr"));
    if(state.groups.respEffort)v.push("Effort "+state.groups.respEffort);
    if(state.groups.mm)v.push("MM "+state.groups.mm);
    if(v.length)L.push("Vitals: "+v.join(", "));
    var lab=[]; if(val("pcv"))lab.push("PCV "+val("pcv")); if(val("tp"))lab.push("TP "+val("tp")); if(val("glucose"))lab.push("Gluc "+val("glucose"));
    if(lab.length)L.push("Bloodwork: "+lab.join(", "));

    var abn=[]; Object.keys(state.systems).forEach(function(id){var s=state.systems[id];
      if(s.abnl)abn.push(titleCase(id)+(s.note?": "+s.note:""));});
    L.push(abn.length?"Abnormal systems: "+abn.join("; "):"Systems: all normal");

    var syn=[]; SYNDROMES.forEach(function(name){var id=slug(name); if(!state.syndromes[id])return;
      var p=name; if(name==="Other"){var o=val("other-name"); if(o)p="Other ("+o+")";}
      if(state.subcats[id]&&state.subcats[id].length)p+=" ["+state.subcats[id].join(", ")+"]";
      var nt=val("note-"+id); if(nt)p+=": "+nt; syn.push(p);});
    if(syn.length)L.push("Syndrome: "+syn.join(" | "));

    var tx=[]; TREATMENTS.forEach(function(name){var id=slug(name); if(!state.tx[id])return;
      var label=name; if(name==="Other"){var dn=val("tx-other-name"); if(dn)label=dn;}
      var parts=[label]; var ml=val("ml-"+id); if(ml)parts.push(ml+" ml");
      if(state.txRoute[id])parts.push(state.txRoute[id]); tx.push(parts.join(" "));});
    if(tx.length)L.push("Treatments: "+tx.join("; "));
    if(val("otherComments"))L.push("Comments: "+val("otherComments"));
    return L.join("\n");
  }
  function render(){
    document.getElementById("summaryText").textContent=buildSummary()||"—";
    var pt=[]; if(val("animalId"))pt.push("ID "+val("animalId")); if(state.groups.species)pt.push(state.groups.species);
    var a=[]; SYNDROMES.forEach(function(n){if(state.syndromes[slug(n)])a.push(n);}); if(a.length)pt.push(a.join(", "));
    document.getElementById("ptline").textContent=pt.length?pt.join(" · "):"New exam";
  }

  // ---- persistence ----
  function collect(){
    var d={inputs:{},groups:state.groups,systems:{},syndromes:{},subcats:state.subcats,
           tx:{},txRoute:{},txMl:{},synNotes:{},adv:!adv.hidden};
    ["owner","animalId","color","age","weight","temp","hr","rr","pcv","tp","glucose","other-name","tx-other-name","otherComments"].forEach(function(id){
      var e=document.getElementById(id); if(e)d.inputs[id]=e.value;});
    Object.keys(state.systems).forEach(function(id){d.systems[id]={abnl:state.systems[id].abnl,note:state.systems[id].note};});
    SYNDROMES.forEach(function(n){var id=slug(n); d.syndromes[id]=!!state.syndromes[id];
      var e=document.getElementById("note-"+id); if(e)d.synNotes[id]=e.value;});
    TREATMENTS.forEach(function(n){var id=slug(n); d.tx[id]=!!state.tx[id]; d.txRoute[id]=state.txRoute[id]||null;
      var e=document.getElementById("ml-"+id); if(e)d.txMl[id]=e.value;});
    return d;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(collect()));}catch(e){}}
  function load(){
    var raw; try{raw=localStorage.getItem(KEY);}catch(e){return;} if(!raw)return;
    var d; try{d=JSON.parse(raw);}catch(e){return;}
    if(d.inputs)Object.keys(d.inputs).forEach(function(id){var e=document.getElementById(id); if(e)e.value=d.inputs[id];});
    if(d.groups)Object.keys(d.groups).forEach(function(name){var v=d.groups[name];
      var g=document.querySelector('.pills[data-group="'+name+'"]'); if(!g)return;
      g.querySelectorAll("button").forEach(function(b){var t=b.textContent.trim();
        if(Array.isArray(v)){if(v.indexOf(t)>=0)b.classList.add("active");}else if(v===t)b.classList.add("active");});
      state.groups[name]=v;}); updateRepro();
    if(d.systems)Object.keys(d.systems).forEach(function(id){var s=d.systems[id]; if(!s||!state.systems[id])return;
      state.systems[id].note=s.note||""; state.systems[id]._note.value=s.note||""; setSys(id,!!s.abnl);});
    if(d.syndromes)Object.keys(d.syndromes).forEach(function(id){if(d.syndromes[id]){var b=state.syndromes[id+"_btn"];
      if(b){state.syndromes[id]=true;b.classList.add("active");var p=document.getElementById("panel-"+id);if(p)p.hidden=false;}}});
    if(d.subcats)Object.keys(d.subcats).forEach(function(id){state.subcats[id]=d.subcats[id]||[];
      var w=document.querySelector('[data-sub="'+id+'"]'); if(!w)return;
      w.querySelectorAll("button").forEach(function(b){if(d.subcats[id].indexOf(b.textContent)>=0)b.classList.add("active");});});
    if(d.synNotes)Object.keys(d.synNotes).forEach(function(id){var e=document.getElementById("note-"+id); if(e)e.value=d.synNotes[id];});
    if(d.tx)Object.keys(d.tx).forEach(function(id){if(d.tx[id]){var b=state.tx[id+"_btn"];
      if(b){state.tx[id]=true;b.classList.add("active");var p=document.getElementById("txpanel-"+id);if(p)p.hidden=false;}}});
    if(d.txRoute)Object.keys(d.txRoute).forEach(function(id){var r=d.txRoute[id]; if(!r)return; state.txRoute[id]=r;
      var w=document.querySelector('[data-route="'+id+'"]'); if(!w)return;
      w.querySelectorAll("button").forEach(function(b){if(b.textContent.trim()===r)b.classList.add("active");});});
    if(d.txMl)Object.keys(d.txMl).forEach(function(id){var e=document.getElementById("ml-"+id); if(e)e.value=d.txMl[id];});
    if(d.adv){adv.hidden=false;advT.setAttribute("aria-expanded","true");advT.querySelector(".chev").classList.add("up");}
  }

  document.getElementById("copyBtn").addEventListener("click",function(){
    var t=buildSummary(), btn=this;
    function ok(){var o=btn.textContent;btn.textContent="Copied ✓";setTimeout(function(){btn.textContent=o;},1400);}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){fb(t);ok();});
    else{fb(t);ok();}
  });
  function fb(t){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);}
  document.getElementById("clearBtn").addEventListener("click",function(){
    if(!confirm("Clear this exam and start a new one?"))return;
    try{localStorage.removeItem(KEY);}catch(e){}location.reload();});

  load(); render();
})();
</script>
